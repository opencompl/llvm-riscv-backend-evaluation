name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add LLVM apt repository
        uses: gerlero/add-apt-repository@v1
        with:
          uri: http://apt.llvm.org/noble/
          key: https://apt.llvm.org/llvm-snapshot.gpg.key
          component: main
          suite: llvm-toolchain-noble-22

      - name: Install LLVM/MLIR tools
        uses: gerlero/apt-install@v1
        with:
          packages: mlir-22-tools llvm-22 clang-22 lld-22

      - name: Add tool symlinks
        run: |
          sudo ln -sf /usr/bin/mlir-opt-22 /usr/bin/mlir-opt
          sudo ln -sf /usr/bin/mlir-translate-22 /usr/bin/mlir-translate
          sudo ln -sf /usr/bin/llc-22 /usr/bin/llc
          sudo ln -sf /usr/bin/llvm-mca-22 /usr/bin/llvm-mca
          sudo ln -sf /usr/bin/opt-22 /usr/bin/opt
          sudo ln -sf /usr/bin/clang-22 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-22 /usr/bin/ld.lld

      # bench.py assembles with riscv64-linux-gnu-gcc and links static RISC-V
      # binaries (sysroot /usr/riscv64-linux-gnu, libgcc from /usr/lib/gcc-cross).
      - name: Install RISC-V cross toolchain
        run: sudo apt-get install -y gcc-riscv64-linux-gnu

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Set up Veir
        run: git submodule update --init -- veir

      - name: Build Veir
        uses: leanprover/lean-action@v1
        with:
          build-args: "--iofail"
          test: false
          lake-package-directory: "veir"
          
      - name: Set up Gem5
        run: git submodule update --init -- gem5

      - name: Get gem5 submodule SHA
        id: gem5-sha
        run: echo "sha=$(git rev-parse HEAD:gem5)" >> "$GITHUB_OUTPUT"

      # Cache only the final binary: it is self-contained (embeds its Python
      # standard library), and the full scons build tree exceeds GitHub's
      # 10 GB cache quota.
      - name: Cache gem5 binary
        id: gem5-cache
        uses: actions/cache@v4
        with:
          path: gem5/build/RISCV/gem5.opt
          key: gem5-riscv-${{ steps.gem5-sha.outputs.sha }}

      # scons is needed unconditionally: the m5 utility library below is
      # rebuilt even when the gem5 binary itself comes from the cache.
      - name: Install gem5 build dependencies
        run: sudo apt-get install -y scons python3-dev m4

      - name: Build Gem5
        if: steps.gem5-cache.outputs.cache-hit != 'true'
        run: cd gem5 && scons build/RISCV/gem5.opt -j "$(nproc)"

      # bench.py links every benchmark against libm5.a.
      - name: Build m5 utility library
        run: |
          cd gem5/util/m5
          scons riscv.CROSS_COMPILE=riscv64-linux-gnu- build/riscv/out/libm5.a

      - name: Build Bugs
        uses: leanprover/lean-action@v1
        with:
          build-args: "--iofail"
          test: false
      
      - name: Build Utils
        run: uv build utils
      
      - name: Install poppler-utils
        run: sudo apt-get install -y poppler-utils

      - name: Make tests
        run: make all

      - name: Post PR comment with table
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs')

            const asset = {
              file: 'real-benchmarks/data/cycles_ratio_table_real.png',
              path: `pr-${context.issue.number}/cycles_ratio_table_real.png`,
              alt: 'Real benchmarks — #cycles per iteration (ratio vs SelectionDAG)',
            }

            // Ensure ci-assets branch exists, creating it from the default branch if not
            try {
              await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: 'ci-assets' })
            } catch (_) {
              const { data: head } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: context.payload.repository.default_branch,
              })
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/heads/ci-assets',
                sha: head.commit.sha,
              })
            }

            const content = fs.readFileSync(asset.file, { encoding: 'base64' })

            let sha
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: asset.path,
                ref: 'ci-assets',
              })
              sha = data.sha
            } catch (_) {}

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: asset.path,
              message: `ci: update table for PR #${context.issue.number}`,
              content,
              branch: 'ci-assets',
              ...(sha && { sha }),
            })

            const imageUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/ci-assets/${asset.path}`
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `![${asset.alt}](${imageUrl})`,
            })

